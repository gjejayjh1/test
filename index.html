<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 28px;
      line-height: 1.7;
      color: #cbd5e1;
    }

    button {
      appearance: none;
      background: #38bdf8;
      border: none;
      border-radius: 999px;
      color: #0f172a;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(56, 189, 248, 0.35);
    }

    .numbers {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ball {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #f8fafc, #e2e8f0);
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 700;
      box-shadow: inset 0 -4px 12px rgba(15, 23, 42, 0.18);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>로또 번호 추첨기</h1>
    <p>버튼을 눌러 1부터 45까지의 로또 번호 6개를 무작위로 생성합니다. 중복 없이 자동 정렬됩니다.</p>
    <button id="drawButton" type="button">번호 뽑기</button>
    <div class="numbers" id="numbers"></div>
  </div>

  <script>
    function generateLottoNumbers() {
      const numbers = Array.from({ length: 45 }, (_, i) => i + 1);
      const selected = [];

      while (selected.length < 6) {
        const randomIndex = Math.floor(Math.random() * numbers.length);
        selected.push(numbers.splice(randomIndex, 1)[0]);
      }

      return selected.sort((a, b) => a - b);
    }

    function renderNumbers() {
      const numbersContainer = document.getElementById('numbers');
      numbersContainer.innerHTML = '';
      const lottoNumbers = generateLottoNumbers();

      lottoNumbers.forEach((num) => {
        const ball = document.createElement('div');
        ball.className = 'ball';
        ball.textContent = num;
        numbersContainer.appendChild(ball);
      });
    }

    document.getElementById('drawButton').addEventListener('click', renderNumbers);
  </script>
</body>
</html>
